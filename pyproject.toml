[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "unitsize"
version = "0.2.0"
description = "Human readable byte sizes, both directions"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["unitsize"]

[tool.pytest.ini_options]
testpaths = ["tests"]
